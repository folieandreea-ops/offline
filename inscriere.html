<!DOCTYPE html>
<html lang="ro" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Înscriere | Offline Speed Dating București</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Meniul din dreapta sus */
        .nav-right {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 18px;
            backdrop-filter: blur(5px);
            border-radius: 30px;
        }
        .nav-link {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .nav-link:hover {
            color: #ffffff;
        }
        .lang-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .spark {
            background: linear-gradient(135deg, #ff2a85 0%, #ff75bc 50%, #441128 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Secțiunea principală cu formularul */
        .form-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 20px 80px 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .form-header h1 {
            font-size: 2.3rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .form-header p {
            color: #a0a0a0;
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 0;
        }

        /* Containerul pentru Microsoft Forms Iframe */
        .form-embed-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .form-embed-container iframe {
            width: 100%;
            height: 750px;
            border: none;
            border-radius: 12px;
            background: transparent;
        }

        /* Subsol */
        .footer-section {
            text-align: center;
            padding: 60px 20px 40px 20px;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            margin-top: auto;
        }
        .terms-link {
            color: #a0a0a0;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .terms-link:hover {
            color: #ffffff;
        }

        /* Mobil */
        @media (max-width: 768px) {
            .form-section {
                padding: 100px 15px 60px 15px;
            }
            .form-header h1 {
                font-size: 1.8rem;
            }
            .form-embed-container {
                padding: 10px;
            }
            .form-embed-container iframe {
                height: 700px;
            }
            .nav-right {
                top: 15px;
                right: 15px;
                padding: 6px 12px;
                gap: 12px;
                overflow-x: auto;
                max-width: 90vw;
            }
            .nav-link {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Meniul din dreapta sus -->
    <div class="nav-right">
        <button class="lang-btn" id="langToggle" onclick="switchLanguage()">EN</button>
        <a href="index.html" class="nav-link" id="navHome">Acasă</a>
        <a href="calendar.html" class="nav-link" id="navCalendar">Calendar</a>
        <a href="faq.html" class="nav-link" id="navFaq">FAQ</a>
    </div>

    <!-- Conținut Principal Formular -->
    <div class="form-section">
        <div class="form-header">
            <h1 id="pageTitle">Rezervă-ți locul <span class="spark">Offline</span></h1>
            <p id="pageSubtitle">Completează formularul de mai jos pentru a ne asigura că păstrăm un mediu sigur, echilibrat și orientat spre conexiuni autentice.</p>
        </div>

        <div class="form-embed-container">
            <!-- Formularul tău Microsoft Forms integrat -->
            <iframe width="640px" height="480px" src="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=AiefPKzJ7U2oUu-Q1GBqMHqJY3HI4TBInGKIVG25u_VUMjdCREtYMldXV0w5MkpWRlYwVEdCR1ZIMC4u&embed=true" frameborder="0" marginwidth="0" marginheight="0" style="border: none; max-width:100%; max-height:100vh" allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen></iframe>
        </div>
    </div>

    <!-- Subsol -->
    <div class="footer-section">
        <a href="terms.html" class="terms-link" id="termsText">Termeni și Condiții</a>
    </div>

    <!-- Script complet pentru comutarea limbii (RO / EN) -->
    <script>
        let currentLang = 'ro';

        const texts = {
            ro: {
                langBtn: "EN",
                navHome: "Acasă",
                navCalendar: "Calendar",
                navFaq: "FAQ",
                pageTitle: 'Rezervă-ți locul <span class="spark">Offline</span>',
                pageSubtitle: "Completează formularul de mai jos pentru a ne asigura că păstrăm un mediu sigur, echilibrat și orientat spre conexiuni autentice.",
                terms: "Termeni și Condiții"
            },
            en: {
                langBtn: "RO",
                navHome: "Home",
                navCalendar: "Calendar",
                navFaq: "FAQ",
                pageTitle: 'Reserve your <span class="spark">Offline</span> spot',
                pageSubtitle: "Fill out the form below to help us ensure a safe, balanced environment focused on authentic connections.",
                terms: "Terms & Conditions"
            }
        };

        function switchLanguage() {
            currentLang = currentLang === 'ro' ? 'en' : 'ro';
            const t = texts[currentLang];

            document.getElementById('langToggle').innerHTML = t.langBtn;
            document.getElementById('navHome').innerHTML = t.navHome;
            document.getElementById('navCalendar').innerHTML = t.navCalendar;
            document.getElementById('navFaq').innerHTML = t.navFaq;
            document.getElementById('pageTitle').innerHTML = t.pageTitle;
            document.getElementById('pageSubtitle').innerHTML = t.pageSubtitle;
            document.getElementById('termsText').innerHTML = t.terms;
            document.getElementById('html-root').setAttribute('lang', currentLang);
        }
    </script>
</body>
</html>
