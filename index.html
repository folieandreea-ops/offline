<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Conectare reală în București</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            position: relative;
        }
        /* Logo-ul oficial în stânga sus */
        .brand-logo {
            position: absolute;
            top: 25px;
            left: 30px;
            max-width: 140px;
            height: auto;
        }
        /* Butonul de Instagram în dreapta sus */
        .instagram-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .instagram-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .container {
            max-width: 700px;
            padding: 20px;
        }
        /* Stilul pentru mesajul principal */
        .hero-text {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin: 0;
        }
        /* Efectul de gradient de la roz spre tonuri închise/negru pentru "spark" */
        .spark {
            background: linear-gradient(135deg, #ff2a85 0%, #ff75bc 50%, #441128 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Logo-ul oficial în stânga sus -->
    <a href="#">
        <img src="WhatsApp Image 2026-09-15 at 09.19.50.jpeg" alt="OFFLINE" class="brand-logo">
    </a>

    <!-- Butonul de Instagram în dreapta sus -->
    <a href="https://www.instagram.com/getoffline404" target="_blank" class="instagram-btn">
        Instagram
    </a>

    <div class="container">
        <!-- Mesajul principal -->
        <h1 class="hero-text">
            Mai puțin scroll.<br>Mai mult <span class="spark">spark</span>.
        </h1>
    </div>

</body>
</html>
