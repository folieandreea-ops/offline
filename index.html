<!DOCTYPE html>
<html lang="ro" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Socializare și Conexiuni Reale în București</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Navigare sus */
        .nav-right {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 18px;
            backdrop-filter: blur(5px);
            border-radius: 30px;
        }
        .nav-link {
            color: #a0a0a0;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        .nav-link:hover {
            color: #ffffff;
        }
        .lang-btn {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .lang-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Conținut Principal */
        .hero-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 20px 60px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .hero-logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .spark {
            background: linear-gradient(135deg, #ff2a85 0%, #ff75bc 50%, #441128 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-desc {
            color: #a0a0a0;
            font-size: 1.15rem;
            line-height: 1.6;
            max-width: 600px;
            margin-bottom: 40px;
        }
        .cta-btn {
            background: linear-gradient(135deg, #ff2a85 0%, #ff75bc 100%);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: opacity 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 42, 133, 0.3);
        }
        .cta-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Subsol */
        .footer-section {
            text-align: center;
            padding: 40px 20px;
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
        }
        .footer-section img {
            max-width: 130px;
            height: auto;
        }
        .footer-socials {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .social-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .social-icon-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            transition: fill 0.3s ease;
        }
        .social-icon-btn:hover {
            background-color: #ffffff;
            border-color: #ffffff;
        }
        .social-icon-btn:hover svg {
            fill: #000000;
        }
        .terms-link {
            color: #a0a0a0;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .terms-link:hover {
            color: #ffffff;
        }

        /* Mobil */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            .hero-desc {
                font-size: 1rem;
            }
            .nav-right {
                top: 15px;
                right: 15px;
                padding: 6px 12px;
                gap: 12px;
                overflow-x: auto;
                max-width: 90vw;
            }
            .nav-link {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Meniul din dreapta sus -->
    <div class="nav-right">
        <button class="lang-btn" id="langToggle" onclick="switchLanguage()">EN</button>
        <a href="index.html" class="nav-link" id="navHome">Acasă</a>
        <a href="calendar.html" class="nav-link" id="navCalendar">Calendar</a>
        <a href="faq.html" class="nav-link" id="navFaq">FAQ</a>
        <a href="galerie.html" class="nav-link" id="navGallery">Galerie Foto</a>
    </div>

    <!-- Conținut principal Hero -->
    <div class="hero-container">
        <img src="WhatsApp Image 2026-09-15 at 09.19.50.jpeg" alt="OFFLINE Logo" class="hero-logo">
        <h1 id="heroTitle">Conexiuni reale, <span class="spark">fără ecrane.</span></h1>
        <p id="heroDesc" class="hero-desc">Lăsăm telefoanele deoparte și ne redescoperim prin conversații autentice, jocuri și oameni faini în București.</p>
        <a href="calendar.html" class="cta-btn" id="ctaButton">Vezi Calendarul</a>
    </div>

    <!-- Subsol -->
    <div class="footer-section">
        <img src="WhatsApp Image 2026-09-15 at 09.19.50.jpeg" alt="OFFLINE">
        <div class="footer-socials">
            <a href="https://www.instagram.com/getoffline404" target="_blank" class="social-icon-btn" title="Instagram">
                <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
            </a>
            <a href="https://www.facebook.com" target="_blank" class="social-icon-btn" title="Facebook">
                <svg viewBox="0 0 24 24"><path d="M9 8H6v4h3v12h5V12h3.642L18 8h-4V6.333C14 5.37 14.5 5 15.5 5H18V0h-3.808C10.5 0 9 1.5 9 4.615V8z"/></svg>
            </a>
        </div>
        <a href="terms.html" class="terms-link" id="termsText">Termeni și Condiții</a>
    </div>

    <!-- Script pentru schimbarea limbii -->
    <script>
        let currentLang = 'ro';

        const texts = {
            ro: {
                langBtn: "EN",
                navHome: "Acasă",
                navCalendar: "Calendar",
                navFaq: "FAQ",
                navGallery: "Galerie Foto",
                heroTitle: 'Conexiuni reale, <span class="spark">fără ecrane.</span>',
                heroDesc: "Lăsăm telefoanele deoparte și ne redescoperim prin conversații autentice, jocuri și oameni faini în București.",
                ctaButton: "Vezi Calendarul",
                terms: "Termeni și Condiții"
            },
            en: {
                langBtn: "RO",
                navHome: "Home",
                navCalendar: "Calendar",
                navFaq: "FAQ",
                navGallery: "Photo Gallery",
                heroTitle: 'Real connections, <span class="spark">no screens.</span>',
                heroDesc: "We put our phones away and rediscover each other through authentic conversations, games, and great people in Bucharest.",
                ctaButton: "View Calendar",
                terms: "Terms & Conditions"
            }
        };

        function switchLanguage() {
            currentLang = currentLang === 'ro' ? 'en' : 'ro';
            const t = texts[currentLang];

            document.getElementById('langToggle').innerHTML = t.langBtn;
            document.getElementById('navHome').innerHTML = t.navHome;
            document.getElementById('navCalendar').innerHTML = t.navCalendar;
            document.getElementById('navFaq').innerHTML = t.navFaq;
            document.getElementById('navGallery').innerHTML = t.navGallery;
            document.getElementById('heroTitle').innerHTML = t.heroTitle;
            document.getElementById('heroDesc').innerHTML = t.heroDesc;
            document.getElementById('ctaButton').innerHTML = t.ctaButton;
            document.getElementById('termsText').innerHTML = t.terms;
            document.getElementById('html-root').setAttribute('lang', currentLang);
        }
    </script>
</body>
</html>
