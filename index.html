<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Conectare reală în București</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            position: relative;
        }
        /* Stilul pentru butonul din dreapta sus */
        .instagram-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .instagram-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        p {
            color: #a0a0a0;
            font-size: 1.1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Butonul de Instagram fixat în dreapta sus -->
    <a href="https://www.instagram.com/getoffline404" target="_blank" class="instagram-btn">
        Instagram
    </a>

    <div class="container">
        <!-- Logo-ul tău -->
       <img src="WhatsApp Image 2026-09-15 at 09.19.50.jpeg" alt="OFFLINE" style="max-width: 200px; height: auto; margin-bottom: 20px;">
        
        <!-- Textul principal -->
        <p>Lăsăm aplicațiile deoparte. Conectare reală, față în față, în București.</p>
    </div>

</body>
</html>
